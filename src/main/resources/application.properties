# Application Name
spring.application.name=circustock

# Server Port
server.port=${PORT:8081}

# MySQL Database Configuration (Local Default + AWS RDS Overrides via Environment Variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/electronics_inventory?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Parth@01234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Multipart File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
file.upload-dir=uploads
